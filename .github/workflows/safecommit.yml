name: PrivGuard Nexus — AI Code Review

on:
  # Review pull requests before they're merged…
  pull_request:
    branches: [main, master, develop]
  # …and direct pushes to main after they land (merged PRs are skipped).
  push:
    branches: [main]

jobs:
  privguard-nexus:
    name: PrivGuard Nexus
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write   # post review comments on pull requests
      contents: write        # post comments on pushed commits (push mode)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # LLM reasoning runs only when the LLM_API_KEY secret is set.
      # Defaults to Google Gemini's OpenAI-compatible API; override with the
      # LLM_API_URL / LLM_MODEL repository variables to use another provider.
      - name: Run PrivGuard Nexus
        id: nexus
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          llm-api-url:  ${{ secrets.LLM_API_KEY != '' && (vars.LLM_API_URL || 'https://generativelanguage.googleapis.com/v1beta/openai') || '' }}
          llm-api-key:  ${{ secrets.LLM_API_KEY }}
          llm-model:    ${{ vars.LLM_MODEL || 'gemini-2.5-flash' }}
          strict-mode:  'true'
          min-severity: 'MEDIUM'
          # Optional: send each review to the live dashboard
          dashboard-url:   ${{ vars.DASHBOARD_URL }}
          dashboard-token: ${{ secrets.DASHBOARD_TOKEN }}

      - name: Echo decision
        if: always()
        run: |
          echo "Decision: ${{ steps.nexus.outputs.decision }}"
          echo "Overall score: ${{ steps.nexus.outputs.overall-score }}"
